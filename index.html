/* Vista por ciclo (la de siempre). Los filtros avanzados la sustituyen por una búsqueda en todo el historial. */
function movCycleResults() {
  const cy = viewCycle(), exps = expensesIn(cy), incs = incomesIn(cy);
  const items = [];
  const a = ymd(cy.start), b = ymd(cy.end);
  const trs = S.transfers.filter(t => t.date >= a && t.date <= b);
  if (movFilter === "all" || movFilter === "exp") exps.forEach(e => items.push({ date: e.date, t: e.t, html: rowHTML(e), v: -e.amount, m: e.amount }));
  if (movFilter === "all" || movFilter === "inc") incs.forEach(i => items.push({ date: i.date, t: i.t, html: incRowHTML(i), v: i.amount, m: i.amount }));
  if (movFilter === "all" || movFilter === "tr") trs.forEach(t => items.push({ date: t.date, t: t.t, html: trRowHTML(t), v: 0, m: t.amount }));
  items.sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : b.t - a.t);
  const n = items.length;
  const sub = movFilter === "exp" ? `${n} ${n === 1 ? "gasto" : "gastos"} · ${fmt(sum(exps))}`
    : movFilter === "inc" ? `${n} ${n === 1 ? "ingreso" : "ingresos"} · ${fmt(sum(incs))}`
    : movFilter === "tr" ? `${n} ${n === 1 ? "transferencia" : "transferencias"} · ${fmt(sum(trs))}`
    : `${n} ${n === 1 ? "movimiento" : "movimientos"} · balance ${signed(sum(incs) - sum(exps))}`;
  let html = `<small class="muted" style="display:block;margin:0 4px 12px">${sub}</small>` + cycleNav(cy);
  if (!n) return html + `<div class="empty"><span class="e">🧾</span>No hay ${movFilter === "inc" ? "ingresos" : movFilter === "exp" ? "gastos" : movFilter === "tr" ? "transferencias" : "movimientos"} en este ciclo.</div>`;
  const t = today0(), ty = ymd(t), yy = ymd(addDays(t, -1));
  let last = "";
  items.forEach(x => {
    if (x.date !== last) {
      if (last) html += `</div>`;
      last = x.date;
      const d = parseYMD(x.date);
      const net = items.filter(y => y.date === x.date).reduce((s, y) => s + y.v, 0);
      const dayTotal = movFilter === "all" ? signed(net) : movFilter === "tr" ? fmt(items.filter(y => y.date === x.date).reduce((s, y) => s + y.m, 0)) : fmt(Math.abs(net));
      const name = x.date === ty ? "Hoy" : x.date === yy ? "Ayer" : WDAYS[d.getDay()] + " " + dayLabel(d);
      html += `<div class="day"><span>${name}</span><span>${dayTotal}</span></div><div class="list">`;
    }
    html += x.html;
  });
  return html + `</div>`;
}

/* ============ Hojas (modales) ============ */
/* Ventanas (modales) accesibles: rol de diálogo con título, el foco entra al abrir, Escape cierra,
   Tab no se escapa de la ventana y, al cerrar, el foco vuelve al botón que la abrió. */
let sheetOpener = null;
function openSheet(html) {
  const wasOpen = !!$("#sheetbg");
  if (!wasOpen) sheetOpener = document.activeElement;
  closeSheet(true);
  const bg = document.createElement("div");
  bg.className = "bg"; bg.id = "sheetbg"; bg.dataset.act = "closeSheet";
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">${html}</div>`;
  document.body.appendChild(bg);
  document.body.classList.add("lock");
  const h = bg.querySelector("h3");
  if (h) { h.id = "sheetTitle"; h.tabIndex = -1; }
  a11yPass(bg);
  try { (h || bg.querySelector(".sheet")).focus({ preventScroll: true }); } catch (e) {}
}
function closeSheet(keepOpener) {
  const bg = $("#sheetbg");
  if (bg) bg.remove();
  document.body.classList.remove("lock");
  if (keepOpener !== true && sheetOpener) {
    if (document.body.contains(sheetOpener)) { try { sheetOpener.focus({ preventScroll: true }); } catch (e) {} }
    sheetOpener = null;
  }
}
const FOCUSABLE = 'button:not([disabled]), [href], input:not([type=hidden]):not([disabled]), select:not([disabled]), textarea:not([disabled]), summary, [tabindex]:not([tabindex="-1"])';
document.addEventListener("keydown", ev => {
  const bg = $("#sheetbg");
  if (!bg) return;
  if (ev.key === "Escape") { ev.preventDefault(); closeSheet(); return; }
  if (ev.key !== "Tab") return;
  const f = Array.prototype.filter.call(bg.querySelectorAll(FOCUSABLE), x => x.offsetParent !== null || x === document.activeElement);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1], inside = bg.contains(document.activeElement);
  if (ev.shiftKey && (!inside || document.activeElement === first || document.activeElement.id === "sheetTitle")) { ev.preventDefault(); last.focus(); }
  else if (!ev.shiftKey && (!inside || document.activeElement === last)) { ev.preventDefault(); first.focus(); }
});
/* Estados para lectores de pantalla: botones que funcionan como interruptores, iconos decorativos, barras que repiten un número ya escrito */
const TOGGLE_ACTS = { mf: 1, calMode: 1, plansMode: 1, statsMode: 1, rpPreset: 1, pickCat: 1, pickKind: 1, togRem: 1, pickMode: 1, pickGMode: 1, projH: 1, projSrc: 1, projVar: 1, pickColor: 1 };
function a11yPass(root) {
  if (!root || !root.querySelectorAll) return;
  root.querySelectorAll("svg:not([role])").forEach(s => s.setAttribute("aria-hidden", "true"));
  root.querySelectorAll(".bar").forEach(b => b.setAttribute("aria-hidden", "true"));
  root.querySelectorAll("button.chip, button.sw").forEach(b => { if (TOGGLE_ACTS[b.dataset.act]) b.setAttribute("aria-pressed", b.classList.contains("on") ? "true" : "false"); });
  root.querySelectorAll(".formerr").forEach(x => x.setAttribute("role", "alert"));
}
/* Tema: "system" (sigue al dispositivo), "light" o "dark". Se guarda aparte porque se necesita antes de desbloquear. */
function applyTheme() {
  const pref = uiPrefs().theme || "system";
  let dark = pref === "dark";
  if (pref === "system") { try { dark = window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) {} }
  document.documentElement.classList.toggle("dark", dark);
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = dark ? "#002B80" : "#003399";
}
try { window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if ((uiPrefs().theme || "system") === "system") applyTheme(); }); } catch (e) {}

function catSheet(id) {
  const c = id ? S.categories.find(x => x.id === id) : null;
  const color = c ? c.color : PALETTE[S.categories.length % PALETTE.length];
  openSheet(`<h3>${c ? "Editar categoría" : "Nueva categoría"}</h3>
  <form data-form="cat" data-id="${c ? c.id : ""}">
    <label>Nombre<input name="name" maxlength="30" autocomplete="off" value="${c ? esc(c.name) : ""}" required></label>
    <label>Emoji<input name="emoji" maxlength="8" autocomplete="off" value="${c ? esc(c.emoji) : "🏷️"}"></label>
    <div class="lbl">Color</div>
    <div class="swatches">${PALETTE.map(p => `<button type="button" class="sw ${p === color ? "on" : ""}" data-act="pickColor" data-c="${p}" style="background:${p}" aria-label="Color ${p}"></button>`).join("")}</div>
    <input type="hidden" name="color" value="${color}">
    <button class="btn primary" type="submit">Guardar</button>
    ${c && S.categories.length > 1 ? `<button type="button" class="btn danger" data-act="delCat" data-id="${c.id}">Eliminar categoría</button>` : ""}
  </form>`);
}

/* ============ Render ============ */
function render() {
  const app = $("#app"), nav = $("nav"), fab = $("#fab");
  if (LOCKED || CORRUPT) { nav.hidden = true; fab.hidden = true; app.innerHTML = LOCKED ? lockView() : corruptView(); return; }
  if (!S) {
    nav.hidden = true; fab.hidden = true;
    if (!setupCats.length) setupCats = DEFAULT_CATS.map((c, i) => ({ name: c[0], emoji: c[1], color: PALETTE[i % PALETTE.length] }));
    app.innerHTML = setupView();
    renderSetupCats();
    return;
  }
  nav.hidden = false;
  document.querySelectorAll("nav button").forEach(b => {
    const on = b.dataset.tab === (tab === "accounts" || tab === "assist" ? "home" : tab);
    b.classList.toggle("on", on);
    if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  const plansFab = tab === "cycles" && plansMode !== "cycles" && plansMode !== "proj";
  fab.hidden = !(["home", "movements", "stats", "calendar"].includes(tab) || plansFab);
  const PF = { budgets: ["newBud", "+ Presupuesto"], subs: ["newSub", "+ Suscripción"], goals: ["newGoal", "+ Meta"], debts: ["newDebt", "+ Deuda"] };
  fab.dataset.act = tab === "calendar" ? "addEv" : plansFab ? PF[plansMode][0] : "add";
  fab.textContent = tab === "calendar" ? "+ Evento" : plansFab ? PF[plansMode][1] : "+ Agregar gasto";
  const views = { home: homeView, assist: assistView, accounts: accountsView, movements: movView, calendar: calView, stats: statsTabView, cycles: plansView, settings: settingsView };
  app.innerHTML = views[tab]();
  a11yPass(app); a11yPass($("nav"));
  const h1 = app.querySelector(".head h1");
  if (h1) { const ht = h1.textContent.trim(); document.title = ht === "Mi presupuesto" ? ht : ht + " · Mi presupuesto"; }
  if (tab === "settings") fillStorageInfo();
}
/* Al cambiar de pantalla: el foco va al título (los lectores de pantalla lo anuncian) y se actualiza el título de la pestaña */
function setTab(t) {
  tab = t; render(); window.scrollTo(0, 0);
  const h = $("#app h1");
  if (h) { h.tabIndex = -1; try { h.focus({ preventScroll: true }); } catch (e) {} const ht = h.textContent.trim(); document.title = ht === "Mi presupuesto" ? ht : ht + " · Mi presupuesto"; }
}
function setView(cy) { viewKey = cy.key === curCycle().key ? null : cy.key; render(); }

/* ============ Eventos ============ */
document.addEventListener("click", ev => {
  const tb = ev.target.closest("[data-tab]");
  if (tb) { if (tb.dataset.tab === "home") viewKey = null; setTab(tb.dataset.tab); return; }
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === "closeSheet") { if (ev.target === el) closeSheet(); return; }
  switch (act) {
    case "add": expenseSheet(null); break;
    case "edit": expenseSheet(id); break;
    case "plansMode": plansMode = el.dataset.m; render(); break;
    case "goBudgets": plansMode = "budgets"; setTab("cycles"); break;
    case "goSubs": plansMode = "subs"; setTab("cycles"); break;
    case "goAssist": setTab("assist"); break;
    case "asAsk": asAsk(el.dataset.q); render(); scrollAssist(); break;
    case "asConfirm": asConfirm(Number(el.dataset.i)); render(); scrollAssist(); break;
    case "asCancel": { const m = ASSIST.msgs[Number(el.dataset.i)]; if (m && !m.done) m.done = "cancel"; render(); break; }
    case "asGo": asGo(Number(el.dataset.i)); break;
    case "statsMode": statsMode = el.dataset.m; render(); break;
    case "rpPreset": RP.preset = el.dataset.p; if (RP.preset === "custom" && !RP.from) { RP.to = todayStr(); RP.from = addDaysStr(RP.to, -29); } render(); break;
    case "rpExport": {
      const rep = buildReport(RP.preset, RP.from, RP.to, RP.acc);
      downloadFile("reporte-" + rep.range.from + "_" + rep.range.eff + ".csv", "text/csv;charset=utf-8", reportCSV(rep));
      toast("Reporte exportado");
      break;
    }
    case "mfToggle": MF.open = !MF.open; $("#mfPanel").hidden = !MF.open; el.setAttribute("aria-expanded", String(MF.open)); break;
    case "mfClear": MF = Object.assign({}, MF_DEFAULT, { open: MF.open }); render(); break;
    case "mfPage": MF.page = Number(el.dataset.p); refreshMov(); { const b = $("#movResults"); if (b) b.scrollIntoView({ block: "start" }); } break;
    case "csvExport": {
      const recs = currentSet();
      if (!recs.length) { toast("No hay movimientos para exportar con estos filtros"); break; }
      downloadFile("movimientos-" + todayStr() + ".csv", "text/csv;charset=utf-8", toCSV(recs));
      toast("Exportados " + recs.length + " movimientos");
      break;
    }
    case "csvAll": {
      const recs = sortRecords(allRecords(), "date_desc");
      if (!recs.length) { toast("Aún no hay movimientos"); break; }
      downloadFile("movimientos-todos-" + todayStr() + ".csv", "text/csv;charset=utf-8", toCSV(recs));
      toast("Exportados " + recs.length + " movimientos");
      break;
    }
    case "csvImport": $("#csvfile").click(); break;
    case "impConfirm": {
      if (!importState) break;
      const n = applyImport(buildImport(importState.text, importState.accId));
      importState = null; closeSheet(); render(); toast(n ? "Importados " + n + " movimientos" : "No había nada nuevo que importar");
      break;
    }
    case "goProj": plansMode = "proj"; setTab("cycles"); break;
    case "projH": S.prefs.projHorizon = Number(el.dataset.h); save(); render(); break;
    case "projSrc": S.prefs.projSrc[el.dataset.k] = !srcOn(el.dataset.k); save(); render(); break;
    case "projVar": S.prefs.projVar = !S.prefs.projVar; save(); render(); break;
    case "projEx": {
      const i = S.prefs.projExclude.indexOf(id);
      if (i >= 0) S.prefs.projExclude.splice(i, 1); else if (S.prefs.projExclude.length < 300) S.prefs.projExclude.push(id);
      save(); render();
      break;
    }
    case "goGoals": plansMode = "goals"; setTab("cycles"); break;
    case "goDebts": plansMode = "debts"; setTab("cycles"); break;
    case "newGoal": goalSheet(null); break;
    case "editGoal": goalSheet(id); break;
    case "goalDetail": goalDetailSheet(id); break;
    case "goalContrib": contribSheet(id); break;
    case "goalWithdraw": withdrawSheet(id); break;
    case "pickGMode": pickGMode(el); break;
    case "goalStatus": setGoalStatus(id, el.dataset.s); closeSheet(); render(); toast("Meta: " + GOAL_STATUS[el.dataset.s].toLowerCase()); break;
    case "delGoal": {
      const g = S.goals.find(x => x.id === id), n = g ? g.contribs.length : 0;
      if (g && confirm(`¿Eliminar la meta "${g.name}"?${n ? "\n\nSe liberará el dinero reservado. Las transferencias ya hechas entre tus cuentas se conservan." : ""}`)) { S.goals = S.goals.filter(x => x.id !== id); save(); closeSheet(); render(); toast("Meta eliminada"); }
      break;
    }
    case "delContrib": {
      const g = S.goals.find(x => x.id === el.dataset.gid), c = g && g.contribs.find(x => x.id === el.dataset.cid);
      if (!c || !confirm("¿Quitar este movimiento de la meta?")) break;
      const both = c.transferId && confirm("Este movimiento creó una transferencia entre tus cuentas.\n\nAceptar = eliminarla también\nCancelar = conservarla");
      const err = deleteContribution(g.id, c.id, !!both);
      if (err) { toast(err); break; }
      goalDetailSheet(g.id); render(); toast("Movimiento quitado");
      break;
    }
    case "newDebt": debtSheet(null); break;
    case "editDebt": debtSheet(id); break;
    case "debtDetail": debtDetailSheet(id); break;
    case "debtPay": debtPaySheet(id); break;
    case "undoPay": {
      const d = S.debts.find(x => x.id === id), p = d && d.payments[d.payments.length - 1];
      if (!p) break;
      const del = p.created && p.refId && confirm("Ese abono creó un movimiento.\n\nAceptar = eliminarlo también\nCancelar = conservarlo");
      undoLastPayment(id, !!del); closeSheet(); render(); toast("Abono deshecho");
      break;
    }
    case "debtStatus": {
      const d = S.debts.find(x => x.id === id);
      if (d) { d.status = d.status === "active" ? "settled" : "active"; save(); closeSheet(); render(); toast(d.status === "active" ? "Deuda reabierta" : "Deuda liquidada"); }
      break;
    }
    case "delDebt":
      if (confirm("¿Eliminar esta deuda y su historial de abonos?\n\nLos gastos o ingresos ya registrados NO se borran.")) { S.debts = S.debts.filter(d => d.id !== id); save(); closeSheet(); render(); toast("Deuda eliminada"); }
      break;
    case "newBud": budgetSheet(null); break;
    case "editBud": budgetSheet(id); break;
    case "budStatus": {
      const b = S.budgets.find(x => x.id === id);
      if (b) { b.status = b.status === "active" ? "archived" : "active"; save(); closeSheet(); render(); toast(b.status === "active" ? "Presupuesto reactivado" : "Presupuesto archivado"); }
      break;
    }
    case "delBud":
      if (confirm("¿Eliminar este presupuesto? Tus gastos no se borran.")) { S.budgets = S.budgets.filter(b => b.id !== id); save(); closeSheet(); render(); toast("Presupuesto eliminado"); }
      break;
    case "newSub": subSheet(null); break;
    case "editSub": subSheet(id); break;
    case "subDetail": subDetailSheet(id); break;
    case "subCharge": {
      const s = S.subs.find(x => x.id === id);
      if (s && s.next && s.next > addDaysStr(todayStr(), 7) && !confirm(`El próximo cobro de ${s.name} es el ${longDate(s.next)}. ¿Registrar un cobro adelantado?`)) break;
      chargeSheet(id);
      break;
    }
    case "subStatus": setSubStatus(id, el.dataset.s); closeSheet(); render(); toast("Suscripción: " + SUB_STATUS[el.dataset.s].toLowerCase()); break;
    case "undoCharge": {
      const s = S.subs.find(x => x.id === id), h = s && s.history[s.history.length - 1];
      if (!h) break;
      const del = h.created && h.refId && confirm("Ese cobro creó un gasto.\n\nAceptar = eliminarlo también\nCancelar = conservarlo en tus movimientos");
      undoLastCharge(id, !!del); closeSheet(); render(); toast("Cobro deshecho");
      break;
    }
    case "delSub":
      if (confirm("¿Eliminar esta suscripción y su historial de cobros?\n\nLos gastos ya registrados NO se borran.")) { S.subs = S.subs.filter(s => s.id !== id); save(); closeSheet(); render(); toast("Suscripción eliminada"); }
      break;
    case "goAccounts": setTab("accounts"); break;
    case "accDetail": accountDetailSheet(id); break;
    case "newAcc": accountSheet(null); break;
    case "editAcc": accountSheet(id); break;
    case "archAcc": {
      const a = accById(id), b = a ? accountBalance(a) : 0;
      if (a && b !== 0 && !confirm(`Su saldo (${fmt(b)}) dejará de contarse en el balance consolidado mientras esté archivada. ¿Archivar "${a.name}"?`)) break;
      const err = setAccountStatus(id, "archived");
      if (err) { toast(err); break; }
      closeSheet(); render(); toast("Cuenta archivada");
      break;
    }
    case "reactAcc": setAccountStatus(id, "active"); closeSheet(); render(); toast("Cuenta reactivada"); break;
    case "delAcc":
      if (confirm("¿Eliminar esta cuenta? No tiene movimientos asociados.")) {
        const err = deleteAccount(id);
        if (err) toast(err); else { closeSheet(); render(); toast("Cuenta eliminada"); }
      }
      break;
    case "newTr": transferSheet(null, id); break;
    case "editTr": {
      const g = goalOfTransfer(id);
      if (g) { toast(`Esta transferencia pertenece a la meta "${g.name}": gestiónala desde la meta`); break; }
      transferSheet(id);
      break;
    }
    case "delTr":
      if (goalOfTransfer(id)) { toast("Esta transferencia pertenece a una meta: quita el aporte desde la meta"); break; }
      if (confirm("¿Eliminar esta transferencia? Los saldos de ambas cuentas se recalcularán.")) { deleteTransfer(id); closeSheet(); render(); toast("Transferencia eliminada"); }
      break;
    case "addEv": eventSheet(null, el.dataset.d); break;
    case "editEv": eventSheet(id); break;
    case "occ": occSheet(el.dataset.key); break;
    case "payOcc": paySheet(el.dataset.key); break;
    case "resched": reschedSheet(el.dataset.key); break;
    case "cancelOcc":
      if (confirm("¿Cancelar solo esta ocurrencia? Las demás repeticiones no cambian.")) { cancelOccurrence(el.dataset.key); closeSheet(); render(); toast("Ocurrencia cancelada"); }
      break;
    case "reopen": {
      const ov = S.occ[el.dataset.key];
      const del = ov && ov.created && ov.refId && confirm("Al confirmarla se creó un " + (ov.refType === "income" ? "ingreso" : "gasto") + ".\n\nAceptar = eliminarlo también\nCancelar = conservarlo en tus movimientos");
      reopenOccurrence(el.dataset.key, !!del); closeSheet(); render(); toast("Vuelve a estar pendiente");
      break;
    }
    case "cancelEv":
      if (confirm("¿Cancelar este evento? Se dejarán de generar nuevas ocurrencias; tu historial de pagos se conserva.")) { setEventStatus(id, "cancelled"); closeSheet(); render(); toast("Evento cancelado"); }
      break;
    case "reactEv": setEventStatus(id, "active"); closeSheet(); render(); toast("Evento reactivado"); break;
    case "delEv":
      if (confirm("¿Eliminar este evento y su historial de ocurrencias?\n\nLos gastos o ingresos reales ya registrados NO se borran.")) { deleteEvent(id); closeSheet(); render(); toast("Evento eliminado"); }
      break;
    case "calMode": calMode = el.dataset.m; render(); break;
    case "calToday": calRef = todayStr(); calSel = calRef; render(); break;
    case "calPrev": case "calNext": {
      const dir = act === "calNext" ? 1 : -1, r = parseYMD(isDate(calRef) ? calRef : todayStr());
      calRef = calMode === "week" ? addDaysStr(ymd(r), 7 * dir) : ymd(new Date(r.getFullYear(), r.getMonth() + dir, 1));
      render(); break;
    }
    case "selDay": calSel = el.dataset.d; render(); break;
    case "goUpcoming": calMode = "upcoming"; calState = "all"; calCat = ""; setTab("calendar"); break;
    case "pickKind":
      el.parentNode.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
      el.classList.add("on"); el.closest("form").elements.kind.value = el.dataset.k;
      break;
    case "togRem": {
      el.classList.toggle("on");
      const f = el.closest("form");
      f.elements.rem.value = Array.from(f.querySelectorAll("[data-act=togRem].on")).map(b => b.dataset.n).join(",");
      break;
    }
    case "pickMode": {
      if (el.disabled) break;
      el.parentNode.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
      el.classList.add("on");
      const f = el.closest("form");
      f.elements.mode.value = el.dataset.m;
      f.querySelector(".js-link").hidden = el.dataset.m !== "link";
      f.querySelectorAll(".js-cat,.js-acc").forEach(x => { x.hidden = el.dataset.m !== "create"; });
      break;
    }
    case "dismissAl": {
      const lg = S.notifLog[id] || (S.notifLog[id] = { sched: Date.now(), tries: 0 });
      lg.dismissed = Date.now(); save(); render();
      break;
    }
    case "notifEnable": enableNotif(); break;
    case "notifDisable": S.prefs.notifBrowser = false; save(); render(); toast("Notificaciones del navegador desactivadas"); break;
    case "notifTest":
      try { new Notification("Mi presupuesto", { body: "Así se verán tus recordatorios." }); toast("Notificación enviada"); }
      catch (e) { toast("Este navegador no pudo mostrar la notificación"); }
      break;
    case "addInc": incomeSheet(null); break;
    case "editInc": incomeSheet(id); break;
    case "mf": movFilter = el.dataset.f; render(); break;
    case "delInc":
      if (confirm("¿Eliminar este ingreso?")) { S.incomes = S.incomes.filter(i => i.id !== id); unlinkRef(id); save(); closeSheet(); render(); toast("Ingreso eliminado"); }
      break;
    case "pickCat": {
      el.parentNode.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
      el.classList.add("on");
      el.closest("form").elements.cat.value = id;
      break;
    }
    case "delExpense":
      if (confirm("¿Eliminar este gasto?")) { S.expenses = S.expenses.filter(e => e.id !== id); unlinkRef(id); save(); closeSheet(); render(); toast("Gasto eliminado"); }
      break;
    case "prevC": { const cy = viewCycle(); setView(mk(cutDate(cy.start.getFullYear(), cy.start.getMonth() - 1, S.settings.cutDay))); break; }
    case "nextC": { const cy = viewCycle(); setView(mk(cy.next)); break; }
    case "openCycle": viewKey = el.dataset.key === curCycle().key ? null : el.dataset.key; setTab("movements"); break;
    case "newCat": catSheet(null); break;
    case "editCat": catSheet(id); break;
    case "pickColor":
      el.parentNode.querySelectorAll(".sw").forEach(c => c.classList.remove("on"));
      el.classList.add("on");
      el.closest("form").elements.color.value = el.dataset.c;
      break;
    case "delCat":
      if (confirm("¿Eliminar esta categoría? Sus gastos se mostrarán como “Sin categoría”.")) {
        S.categories = S.categories.filter(c => c.id !== id); save(); closeSheet(); render(); toast("Categoría eliminada");
      }
      break;
    case "setupAddCat": addSetupCat(); break;
    case "setupRmCat": setupCats.splice(Number(el.dataset.i), 1); renderSetupCats(); break;
    case "export": exportData(); break;
    case "import": $("#file").click(); break;
    case "reset": case "wipeStart": wipeSheet(); break;
    case "wipeConfirm": {
      const w = document.querySelector("[name=wipeword]");
      if (!w || w.value.trim().toUpperCase() !== "BORRAR") break;
      wipeAll(); closeSheet(); render(); window.scrollTo(0, 0); toast("Todos los datos se borraron de este navegador");
      break;
    }
    case "encOn": encOnSheet(); break;
    case "encOff": case "encChange": passSheet(act); break;
    case "lockNow": lockNow().then(ok => { if (!ok) toast("No se pudo bloquear: los datos no están cifrados"); }); break;
    case "exportEnc": exportEncrypted(); break;
    case "fontsToggle": setUiPref("webFonts", uiPrefs().webFonts === false); applyFonts(); render(); toast(uiPrefs().webFonts === false ? "Sin conexiones externas: usando fuentes del sistema" : "Fuentes de Google activadas"); break;
    case "persistReq":
      if (!(navigator.storage && navigator.storage.persist)) { toast("Este navegador no ofrece esta protección"); break; }
      navigator.storage.persist().then(ok => { toast(ok ? "Listo: el navegador no borrará tus datos automáticamente" : "El navegador no lo concedió (suele hacerlo si instalas la app o la usas a menudo)"); fillStorageInfo(); }).catch(() => toast("No se pudo pedir la protección"));
      break;
    case "dlRaw": if (CORRUPT) downloadFile("datos-guardados-" + todayStr() + ".txt", "text/plain;charset=utf-8", CORRUPT); break;
  }
  if (document.body.contains(el)) a11yPass(el.parentNode);
});

function addSetupCat() {
  const inp = $("#newCatName");
  const name = inp.value.trim();
  if (!name) return;
  if (setupCats.length >= 30) return toast("Máximo 30 categorías");
  setupCats.push({ name: name, emoji: "🏷️", color: PALETTE[setupCats.length % PALETTE.length] });
  inp.value = ""; renderSetupCats();
}
document.addEventListener("keydown", ev => {
  if (ev.key === "Enter" && ev.target.id === "newCatName") { ev.preventDefault(); addSetupCat(); }
});

/* Acepta "250", "250,50", "250.50", "$1,234.56", "1.234,56" y "1.500" (miles). Cualquier otra cosa → NaN */
function parseMoney(v) {
  let s = String(v).trim().replace(/[^\d.,-]/g, "");
  if (/^-?[1-9]\d{0,2}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, "");
  else if (/^-?[1-9]\d{0,2}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, "").replace(",", ".");
  else s = s.replace(",", ".");
  const n = /^-?\d*\.?\d+$|^-?\d+\.$/.test(s) ? parseFloat(s) : NaN;
  return isFinite(n) ? round2(n) : NaN;
}
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.classList && t.classList.contains("bad")) { t.classList.remove("bad"); const b = $("#setupErr"); if (b) b.hidden = true; }
});

document.addEventListener("submit", ev => {
  ev.preventDefault();
  const f = ev.target, kind = f.dataset.form, el = f.elements;
  if (["unlock", "encOn", "encOff", "encChange", "impEnc"].indexOf(kind) >= 0) { handleSecureForm(f, kind, el); return; }
  if (kind === "ask") { asAsk(el.q.value); render(); scrollAssist(); return; }
  if (kind === "setup") {
    const budget = parseMoney(el.budget.value), cut = parseInt(el.cut.value, 10);
    /* Error visible junto al botón + campo resaltado (la validación nativa del navegador pasaba desapercibida) */
    const fail = (msg, field) => {
      f.querySelectorAll(".bad").forEach(x => x.classList.remove("bad"));
      const box = $("#setupErr"); box.textContent = msg; box.hidden = false;
      if (field) { field.classList.add("bad"); try { field.focus({ preventScroll: true }); field.scrollIntoView({ block: "center", behavior: "smooth" }); } catch (e) {} }
      toast(msg);
    };
    $("#setupErr").hidden = true;
    if (!(budget > 0)) return fail("Escribe cuánto quieres gastar por ciclo (por ejemplo: 500).", el.budget);
    if (!(cut >= 1 && cut <= 31)) return fail("Escribe el día de corte: un número del 1 al 31 (por ejemplo: 19).", el.cut);
    if (!setupCats.length) return fail("Agrega al menos una categoría de gastos.", $("#newCatName"));
    S = {
      settings: { budget: budget, cutDay: cut, currency: el.cur.value },
      categories: setupCats.map(c => ({ id: uid(), name: c.name, emoji: c.emoji, color: c.color })),
      expenses: [], incomes: [], cycleBudgets: {}, events: [], occ: {}, notifLog: {}, transfers: [], budgets: [], subs: [], goals: [], debts: [],
      accounts: [{ id: uid(), name: "Efectivo", type: "cash", currency: el.cur.value, initial: 0, initialDate: todayStr(), status: "active", desc: "", institution: "", t: Date.now() }],
      prefs: { tz: "", weekStart: 1, notifBrowser: false, defaultAccountId: "" }
    };
    S = normalize(S);

   vive solo en memoria mientras la app está desbloqueada. Cada guardado usa un IV aleatorio nuevo.
   Si se olvida la contraseña, los datos cifrados NO se pueden recuperar (por diseño).

}
async function fillStorageInfo() {
  const el = $("#stInfo");
  if (!el) return;
  let persist = "Desconocida", est = "";
  try {
    if (navigator.storage && navigator.storage.persisted) persist = (await navigator.storage.persisted()) ? "Activada" : "No activada";
    if (navigator.storage && navigator.storage.estimate) { const e = await navigator.storage.estimate(); if (e.quota) est = ` · cuota del navegador: ${Math.round(e.quota / 1048576)} MB`; }
  } catch (e) {}
  const kb = Math.max(1, Math.round((readStore() || "").length / 1024));
  if ($("#stInfo")) $("#stInfo").innerHTML = `<div class="rowline"><span>Protección contra borrado automático</span><b>${persist}</b></div><div class="rowline"><span>Tamaño de tus datos</span><b>${kb} KB</b></div>${est ? `<small class="muted">${est.slice(3)}</small>` : ""}`;
}

/* ============ Respaldo ============ */
function exportData() {
  if (!S) return toast("No hay datos para exportar");
  if (CRYPTO.key && !confirm("Este respaldo se descargará SIN cifrar: cualquiera que tenga el archivo podrá leerlo. ¿Continuar?\n\n(Para un respaldo protegido usa “Exportar cifrado”.)")) return;
  downloadFile("respaldo-presupuesto-" + todayStr() + ".json", "application/json", JSON.stringify(S, null, 2));
  toast("Respaldo generado");
}
async function exportEncrypted() {
  if (!CRYPTO.key) return toast("Activa el cifrado para crear respaldos cifrados");
  await settle();
  downloadFile("respaldo-presupuesto-cifrado-" + todayStr() + ".json", "application/json", JSON.stringify(await makeEncryptedBackup()));
  toast("Respaldo cifrado generado");
}
function applyImported(data) {
  if (!confirm("Se reemplazarán los datos actuales por el respaldo (" + data.expenses.length + " gastos, " + data.incomes.length + " ingresos). ¿Continuar?")) return;
  S = data; CORRUPT = null; viewKey = null; touchCycle(); save(); tab = "home"; closeSheet(); render(); window.scrollTo(0, 0);
  toast(CRYPTO.key ? "Datos importados (se guardan cifrados)" : "Datos importados");
}
$("#file").addEventListener("change", ev => {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = "";
  if (!file) return;
  if (file.size > 5000000) return toast("El archivo es demasiado grande para ser un respaldo (máximo 5 MB)");
  const r = new FileReader();
  r.onload = () => {
    let o = null;
    try { o = JSON.parse(r.result); } catch (e) {}
    if (isEncBlob(o)) { if (!hasCrypto()) return toast("Este navegador no puede abrir respaldos cifrados"); return importEncSheet(o, file.name.slice(0, 60)); }
    const data = o ? normalize(o) : null;
    if (!data) return toast("El archivo no es un respaldo válido");
    applyImported(data);
  };
  r.onerror = () => toast("No se pudo leer el archivo");
  r.readAsText(file);
});
/* Actividad del usuario para el bloqueo automático */
["pointerdown", "keydown", "touchstart", "wheel"].forEach(e => document.addEventListener(e, () => { lastActive = Date.now(); }, { passive: true }));
const shouldAutoLock = () => !!(CRYPTO.key && S && S.prefs.lockMinutes && Date.now() - lastActive > S.prefs.lockMinutes * 60000);
setInterval(() => { if (shouldAutoLock()) lockNow(); }, 15000);
document.addEventListener("input", ev => {
  if (ev.target.name === "wipeword") { const b = $("[data-act=wipeConfirm]"); if (b) b.disabled = ev.target.value.trim().toUpperCase() !== "BORRAR"; }
});

/* Al volver a la app (p. ej. si cambió el ciclo mientras estaba en segundo plano) */
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && S) { if (shouldAutoLock()) { lockNow(); return; } touchCycle(); processAlerts(); render(); }
});
/* Formularios de seguridad (asíncronos: derivar la clave tarda un momento). Botón bloqueado mientras trabajan: sin dobles envíos. */
async function handleSecureForm(f, kind, el) {
  if (f.dataset.busy) return;
  const btn = f.querySelector("button[type=submit]"), box = f.querySelector(".formerr"), label = btn.textContent;
  const fail = msg => { box.textContent = msg; box.hidden = false; };
  f.dataset.busy = "1"; btn.disabled = true; btn.textContent = "Procesando…"; box.hidden = true;
  try {
    if (kind === "unlock") {
      const err = await unlock(el.pass.value);
      if (err) { el.pass.value = ""; return fail(err); }
      touchCycle(); processAlerts(); tab = "home"; render(); window.scrollTo(0, 0); toast("Desbloqueado");
    } else if (kind === "encOn") {
      if (el.p1.value !== el.p2.value) return fail("Las contraseñas no coinciden");
      if (!el.ack.checked) return fail("Marca la casilla para confirmar que entiendes que no hay recuperación");
      const err = await enableEncryption(el.p1.value);
      if (err) return fail(err);
      closeSheet(); render(); toast("Cifrado activado");
    } else if (kind === "encOff") {
      const err = await disableEncryption(el.old.value);
      if (err) return fail(err);
      closeSheet(); render(); toast("Cifrado desactivado");
    } else if (kind === "encChange") {
      if (el.p1.value !== el.p2.value) return fail("Las contraseñas nuevas no coinciden");
      const err = await changePassphrase(el.old.value, el.p1.value);
      if (err) return fail(err);
      closeSheet(); render(); toast("Contraseña cambiada");
    } else if (kind === "impEnc") {
      if (!importState || !importState.encBlob) return fail("Vuelve a elegir el archivo");
      const data = await decryptBackup(importState.encBlob, el.pass.value);
      importState = null; applyImported(data);
    }
  } catch (e) { fail(String((e && e.message) || e)); }
  finally { if (document.body.contains(f)) { delete f.dataset.busy; btn.disabled = false; btn.textContent = label; } }
}

try { STORE = window.localStorage; STORE.getItem(KEY); }
